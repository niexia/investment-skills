<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
  <title id="title">Personal Investment OS architecture</title>
  <desc id="desc">A question enters company-research, which runs six steps from screening through thesis. Each step uses the knowledge base and the data layer. Produces a memo, a fact card and a thesis, which the next earnings updates.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    .band { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .band-soft { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
    .chip { fill: #f0f7f4; stroke: #b7d8cc; stroke-width: 1; }
    .chip-conditional { fill: #fafafa; stroke: #c7c9ce; stroke-width: 1; stroke-dasharray: 4 3; }
    .card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .label { font: 600 10px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; letter-spacing: 1.4px; }
    .h { font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .skill { font: 600 11.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f6f5c; }
    .sub { font: 400 10.5px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    .path { font: 400 9.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
    .note { font: 400 11px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9ca3af; }
    .amber { fill: #fff7ed; stroke: #f3d9b1; }
    .amber-text { font: 500 12.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #92400e; }
    .flow { stroke: #6b7280; stroke-width: 1.2; fill: none; }
    .flow-soft { stroke: #b6bcc6; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .loop { stroke: #b45309; stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect x="0" y="0" width="1000" height="940" rx="16" fill="#ffffff"/>

  <!-- input -->
  <rect class="band-soft" x="60" y="36" width="880" height="76" rx="12"/>
  <text class="label" x="80" y="62">INPUT</text>
  <text class="h" x="80" y="90">Company · ticker · question</text>
  <text class="note" x="920" y="90" text-anchor="end">one question per run</text>

  <path class="flow" d="M 500 112 L 500 150" marker-end="url(#arrow)"/>

  <!-- pipeline band -->
  <rect class="band" x="60" y="156" width="880" height="232" rx="12"/>
  <text class="label" x="80" y="184">RESEARCH PIPELINE</text>
  <text class="note" x="920" y="184" text-anchor="end">orchestrated by company-research</text>

  <!-- chips -->
  <rect class="chip" x="68" y="200" width="122" height="140" rx="10"/>
  <text class="note" x="80" y="222">01</text>
  <text class="skill" x="80" y="244">screen</text>
  <text class="sub" x="80" y="264">Red flags,</text>
  <text class="sub" x="80" y="278">evidence grade</text>

  <rect class="chip" x="215" y="200" width="122" height="140" rx="10"/>
  <text class="note" x="227" y="222">02</text>
  <text class="skill" x="227" y="244">financial-</text>
  <text class="skill" x="227" y="258">analysis</text>
  <text class="sub" x="227" y="278">Filings, ROIC,</text>
  <text class="sub" x="227" y="292">cash conversion</text>

  <rect class="chip" x="362" y="200" width="122" height="140" rx="10"/>
  <text class="note" x="374" y="222">03</text>
  <text class="skill" x="374" y="244">moat-analysis</text>
  <text class="sub" x="374" y="264">Business,</text>
  <text class="sub" x="374" y="278">moat trend</text>

  <rect class="chip-conditional" x="509" y="200" width="122" height="140" rx="10"/>
  <text class="note" x="521" y="222">04</text>
  <text class="skill" x="521" y="244">growth-</text>
  <text class="skill" x="521" y="258">analysis</text>
  <text class="sub" x="521" y="278">Growth source,</text>
  <text class="sub" x="521" y="292">durability</text>
  <text class="note" x="521" y="310">only if growth matters</text>

  <rect class="chip" x="656" y="200" width="122" height="140" rx="10"/>
  <text class="note" x="668" y="222">05</text>
  <text class="skill" x="668" y="244">intrinsic-</text>
  <text class="skill" x="668" y="258">valuation</text>
  <text class="sub" x="668" y="278">Range, reverse</text>
  <text class="sub" x="668" y="292">DCF, scenarios</text>

  <rect class="chip" x="803" y="200" width="122" height="140" rx="10"/>
  <text class="note" x="815" y="222">06</text>
  <text class="skill" x="815" y="244">investment-</text>
  <text class="skill" x="815" y="258">thesis</text>
  <text class="sub" x="815" y="278">Pillars, bear</text>
  <text class="sub" x="815" y="292">case, invalidation</text>

  <!-- arrows between chips -->
  <path class="flow" d="M 192 270 L 210 270" marker-end="url(#arrow)"/>
  <path class="flow" d="M 339 270 L 357 270" marker-end="url(#arrow)"/>
  <path class="flow" d="M 486 270 L 504 270" marker-end="url(#arrow)"/>
  <path class="flow" d="M 633 270 L 651 270" marker-end="url(#arrow)"/>
  <path class="flow" d="M 780 270 L 798 270" marker-end="url(#arrow)"/>

  <text class="note" x="500" y="368" text-anchor="middle">build the fact base first; focused analyses use their own report templates</text>

  <path class="flow" d="M 500 388 L 500 424" marker-end="url(#arrow)"/>

  <!-- outputs -->
  <rect class="band" x="60" y="428" width="880" height="196" rx="12"/>
  <text class="label" x="80" y="456">CORE OUTPUTS</text>
  <text class="note" x="920" y="456" text-anchor="end">full company research</text>

  <rect class="card" x="76" y="472" width="268" height="136" rx="10"/>
  <text class="h" x="94" y="500">Memo</text>
  <text class="path" x="94" y="520">reports/company-research/</text>
  <text class="sub" x="94" y="546">Valuation range, assumptions,</text>
  <text class="sub" x="94" y="562">bear case, invalidation table</text>
  <text class="sub" x="94" y="578">and a source for every number.</text>

  <rect class="card" x="362" y="472" width="268" height="136" rx="10"/>
  <text class="h" x="380" y="500">Fact card</text>
  <text class="path" x="380" y="520">data/companies/&lt;ticker&gt;.md</text>
  <text class="sub" x="380" y="546">Five to ten years of numbers</text>
  <text class="sub" x="380" y="562">with period, currency, unit</text>
  <text class="sub" x="380" y="578">and source. Reused next time.</text>

  <rect class="card" x="648" y="472" width="268" height="136" rx="10"/>
  <text class="h" x="666" y="500">Thesis</text>
  <text class="path" x="666" y="520">reports/theses/</text>
  <text class="sub" x="666" y="546">Pillars, market view, failure</text>
  <text class="sub" x="666" y="562">paths and observable thresholds.</text>
  <text class="sub" x="666" y="578">Dated, never overwritten.</text>

  <path class="flow" d="M 500 624 L 500 662" marker-end="url(#arrow)"/>

  <!-- feedback -->
  <rect class="amber" x="60" y="666" width="880" height="64" rx="12"/>
  <text class="label" x="80" y="690" fill="#b45309">NEXT EARNINGS</text>
  <text class="amber-text" x="80" y="712">Test the invalidation conditions → update the thesis, keep the old version</text>

  <path class="loop" d="M 940 698 L 966 698 L 966 540 L 920 540" marker-end="url(#arrow-amber)"/>

  <!-- evidence -->
  <rect class="band-soft" x="60" y="768" width="880" height="132" rx="12"/>
  <text class="label" x="80" y="796">EVIDENCE LAYER</text>
  <text class="note" x="920" y="796" text-anchor="end">used by every step above</text>

  <rect class="card" x="76" y="810" width="414" height="74" rx="8"/>
  <text class="skill" x="92" y="832" fill="#334155">knowledge/</text>
  <text class="sub" x="92" y="852">Investor frameworks · evidence rules</text>
  <text class="sub" x="92" y="868">checklists · US/HK market differences</text>

  <rect class="card" x="510" y="810" width="414" height="74" rx="8"/>
  <text class="skill" x="526" y="832" fill="#334155">data/</text>
  <text class="sub" x="526" y="852">EDGAR · HKEXnews · IR · quotes</text>
  <text class="sub" x="526" y="868">FX · index methodology</text>

  <!-- evidence rail -->
  <path class="flow-soft" d="M 40 790 L 40 270 L 56 270" marker-end="url(#arrow)"/>
  <text class="note" x="26" y="530" transform="rotate(-90 26 530)" text-anchor="middle">rules &amp; data</text>
</svg>
